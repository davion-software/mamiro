include: package:very_good_analysis/analysis_options.11.0.0.yaml

plugins:
  riverpod_lint: 3.1.9

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/generated_plugin_registrant.dart"
    - lib/l10n/app_localizations*.dart
    - build/**
    - artifacts/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    always_declare_return_types: error
    avoid_catches_without_on_clauses: error
    avoid_dynamic_calls: error
    avoid_print: error
    avoid_slow_async_io: error
    cancel_subscriptions: error
    cast_nullable_to_non_nullable: error
    close_sinks: error
    discarded_futures: error
    empty_catches: error
    exhaustive_cases: error
    only_throw_errors: error
    throw_in_finally: error
    unawaited_futures: error
    use_build_context_synchronously: error

linter:
  rules:
    always_use_package_imports: true
    always_put_required_named_parameters_first: false
    avoid_escaping_inner_quotes: false
    avoid_positional_boolean_parameters: false
    cascade_invocations: false
    directives_ordering: false
    lines_longer_than_80_chars: false
    prefer_const_constructors: true
    prefer_const_declarations: true
    public_member_api_docs: false
    sort_constructors_first: false
    unnecessary_type_name_in_constructor: false
